<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch refined sign-in error, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A5300}a:hover{color:#0E141B}
button,input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3F4F6; color: #0E141B; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 72px 24px 32px; gap: 28px;">
  <div style="display: flex; flex-direction: column; gap: 14px;">
    <div aria-hidden="true" style="position: relative; height: 24px; border-bottom: 2px solid #0E141B; background: repeating-linear-gradient(90deg, transparent 0 15px, #D5DAE0 15px 16px);">
      <span style="position: absolute; left: 12%; bottom: 4px; width: 8px; height: 14px; background: #B3261E;"></span>
      <span style="position: absolute; left: 41%; bottom: 4px; width: 8px; height: 14px; border-radius: 4px; background: #1F5FA8;"></span>
      <span style="position: absolute; left: 66%; bottom: 4px; width: 8px; height: 14px; border-radius: 4px; background: #1F5FA8;"></span>
      <span style="position: absolute; right: 4%; bottom: -6px; top: -6px; width: 2px; background: #8A5300;"></span>
    </div>
    <h1 style="margin: 0; font-size: 34px; font-weight: 600; line-height: 1.1;">WaveWatch</h1>
  </div>
  <div role="alert" style="display: flex; gap: 10px; align-items: flex-start; background: #FDECEA; border: 1px solid #B3261E; color: #8C1D18; border-radius: 6px; padding: 12px; font-size: 15px; line-height: 1.4;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6 M12 16.5h.01"></path></svg>
    <span><b>Sign-in failed.</b> That email and password do not match. Check both and try again, or ask your coordinator for a new invite.</span>
  </div>
  <form style="display: flex; flex-direction: column; gap: 14px;">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600;">Email
      <input type="email" value="coordinator@demo.wavewatch.test" aria-invalid="true" style="height: 50px; border: 2px solid #B3261E; border-radius: 6px; padding: 0 12px; font-size: 16px; font-weight: 400; color: #0E141B; background: #FFFFFF;">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600;">Password
      <input type="password" value="" aria-invalid="true" style="height: 50px; border: 2px solid #B3261E; border-radius: 6px; padding: 0 12px; font-size: 16px; color: #0E141B; background: #FFFFFF;">
    </label>
    <button type="submit" style="min-height: 52px; background: #8A5300; color: #FFFFFF; border: 0; border-radius: 6px; font-size: 17px; font-weight: 600;">Sign in</button>
    <a href="#" style="align-self: center; font-size: 15px; font-weight: 500; padding: 10px;">Forgot password</a>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
