<div style="display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;padding:var(--space-4);background:var(--surface);font-family:var(--font-sans);font-size:14px;font-weight:600;">
  <span style="display:flex;align-items:center;gap:6px;border:1px solid var(--saved-ink);color:var(--saved-ink);border-radius:var(--radius-md);padding:4px 8px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Saved</span>
  <span style="display:flex;align-items:center;gap:6px;border:1px solid var(--ink-muted);color:var(--ink-muted);border-radius:var(--radius-md);padding:4px 8px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>Loading</span>
  <span style="display:flex;align-items:center;gap:6px;background:var(--error-bg);color:var(--error-ink);border-radius:var(--radius-md);padding:4px 10px;"><svg width="10" height="10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="currentColor"></circle></svg>Active</span>
