<style>

  .bk{fill:var(--family-breakin);} .su{fill:var(--family-suspicious);} .ve{fill:var(--family-vehicle);} .vi{fill:var(--family-violent);}
  .pr{fill:var(--family-property);} .ro{fill:var(--family-road);} .em{fill:var(--family-emergency);} .ot{fill:var(--family-other);}
</style>

  <span><svg width="16" height="16" aria-hidden="true"><path class="em" d="M6 1 H10 V6 H15 V10 H10 V15 H6 V10 H1 V6 H6 Z"></path></svg>Emergencies</span>
  <span><svg width="16" height="16" aria-hidden="true"><path class="ot" d="M8 1 L15 6 L12.5 15 L3.5 15 L1 6 Z"></path></svg>Drug-related and other</span>
</div>
