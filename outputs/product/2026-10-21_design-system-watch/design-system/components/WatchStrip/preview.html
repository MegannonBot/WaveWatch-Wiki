<!-- @dsCard group="Signature" height=130 subtitle="Last 24 hours, six incidents" -->
<div style="padding:var(--space-4);background:var(--surface);color:var(--ink);font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-1);">
  <div style="display:flex;justify-content:space-between;font-size:14px;"><span style="font-weight:600;">Last 24 hours</span><span style="color:var(--ink-muted);"><span style="font-family:var(--font-mono);font-weight:600;color:var(--ink);">6</span> incidents</span></div>
  <div role="img" aria-label="Watch strip, last 24 hours: incidents at 02:10, 05:40, 11:20, 17:05, 19:30 and 20:41" style="position:relative;height:32px;border:1px solid var(--control-border);border-radius:var(--radius-md);background:repeating-linear-gradient(90deg,var(--surface) 0 calc(100%/24 - 1px),var(--bg) calc(100%/24 - 1px) calc(100%/24));">
    <span style="position:absolute;left:8%;top:7px;width:9px;height:16px;background:var(--family-breakin);"></span>
    <span style="position:absolute;left:23%;top:7px;width:9px;height:16px;border-radius:5px;background:var(--family-suspicious);"></span>
    <span style="position:absolute;left:47%;top:7px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:16px solid var(--family-vehicle);"></span>
    <span style="position:absolute;left:71%;top:7px;width:9px;height:16px;background:var(--family-breakin);"></span>
    <span style="position:absolute;left:81%;top:7px;width:9px;height:16px;border-radius:5px;background:var(--family-suspicious);"></span>
    <span style="position:absolute;left:85.5%;top:7px;width:9px;height:16px;border-radius:5px;background:var(--family-suspicious);"></span>
    <span style="position:absolute;right:3%;top:-3px;bottom:-3px;width:2px;background:var(--accent);"></span>
  </div>
  <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:13px;color:var(--ink-muted);"><span>24h ago</span><span>12h ago</span><span style="color:var(--accent);font-weight:600;">Now 20:56</span></div>
</div>
