<!-- @dsCard group="Actions" height=120 subtitle="Primary, outline, text and focused" -->
<div style="display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;padding:var(--space-4);background:var(--bg);font-family:var(--font-sans);">
  <button style="min-height:50px;padding:0 20px;background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--radius-lg);font:600 16px/1 var(--font-sans);">Save incident</button>
  <button style="min-height:50px;padding:0 16px;background:var(--surface);color:var(--ink);border:1px solid var(--control-border);border-radius:var(--radius-lg);font:400 16px/1 var(--font-sans);">Cancel</button>
  <button style="min-height:44px;padding:0 14px;background:transparent;color:var(--accent);border:0;font:600 15px/1 var(--font-sans);">Change</button>
  <button style="min-height:44px;padding:0 14px;background:var(--surface);color:var(--ink);border:1px solid var(--control-border);border-radius:var(--radius-lg);font:400 15px/1 var(--font-sans);outline:var(--focus-width) solid var(--focus-ring);outline-offset:var(--focus-offset);">Focused</button>
</div>
<script></script>
