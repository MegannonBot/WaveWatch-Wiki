<style>
  .cv{position:relative;width:960px;height:288px;background:var(--bg);overflow:hidden;font-family:var(--font-sans);}
  .cv svg{position:absolute;left:0;top:0;}
  .ink{fill:var(--ink);} .acc{fill:var(--accent);} .tint{fill:var(--ink-muted);} .bk{fill:var(--family-breakin);} .su{fill:var(--family-suspicious);} .ve{fill:var(--family-vehicle);}
  .cell{fill:none;stroke:var(--control-border);stroke-width:1;} .now{fill:var(--accent);}
  .blk{rx:var(--radius-lg);}
  .name{position:absolute;left:40px;bottom:64px;margin:0;max-width:440px;font-family:var(--font-sans);font-weight:600;font-size:80px;line-height:.95;color:var(--ink);}
  .tag{position:absolute;left:40px;bottom:32px;margin:0;max-width:440px;font-size:14px;line-height:20px;color:var(--ink-muted);}
</style>
<div class="cv">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">

    <!-- arrangement: one tall ink slab at the right with two stacked satellites left of it, all right of x=480 -->
    <!-- pattern: the watch strip, 24 hour cells with three family marks and the Now line, chosen because the README calls the strip the signature and the time column a logbook -->

    <rect class="acc blk" x="480" y="0" width="208" height="136"></rect>
    <rect class="tint blk" x="480" y="152" width="208" height="136"></rect>
    <rect class="ink" x="704" y="0" width="256" height="288"></rect>

      <rect class="bk" x="18" y="8" width="9" height="24"></rect>
      <rect class="su" x="99" y="8" width="9" height="24" rx="4.5"></rect>

    </g>
  </svg>
  <h1 class="name">WaveWatch Watch</h1>
  <p class="tag">What happened, where and when, by day and by night.</p>
</div>
