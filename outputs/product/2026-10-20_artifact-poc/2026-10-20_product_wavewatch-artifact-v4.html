<title>WaveWatch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: one-screen phone app. Header, one scrolling view, bottom tab bar. The map view runs edge to edge; content views sit in a 760px column. */
:root{
  --bg:#EBF0F1; --surface:#FFFFFF; --surface-2:#E1E8EA; --ink:#13232A; --ink-2:#4A5C64; --ink-3:#77898F; --line:#CBD5D9;
  --accent:#0C6670; --accent-soft:#D5EAEC; --on-accent:#FFFFFF;
  --map-land:#F0EEE7; --map-sea:#B7D1D8; --map-water:#A3C6CF; --map-wet:#C6DAD3; --map-green:#DCE5CF; --map-sand:#EEE3C4;
  --map-road:#FFFFFF; --map-case:#C2C6C3; --map-minor:#D6D2C7; --map-major:#F2C66F; --map-major-case:#C2933E; --map-label:#33454C; --map-halo:#F0EEE7;
  --c-red:#C93A29; --c-orange:#D47B17; --c-amber:#B98A12; --c-blue:#2A74C2; --c-sky:#4F93C9; --c-green:#4B8634; --c-magenta:#A1327A; --c-purple:#7147BA; --c-teal:#1D8E83; --c-wine:#AF2238; --c-grey:#7A898F; --c-brown:#9A5B22;
  --warn-bg:#FFF2D6; --warn-ink:#6E4300; --ok-bg:#DDEFDA; --ok-ink:#2B5A1E; --bad-bg:#FBE1DE; --bad-ink:#8A1F14;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 6px 24px rgba(10,30,36,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1519; --surface:#132026; --surface-2:#1A2B32; --ink:#E1EBEE; --ink-2:#9DB0B6; --ink-3:#6E838A; --line:#293C44;
  --accent:#55B7C1; --accent-soft:#163A40; --on-accent:#05252A;
  --map-land:#152227; --map-sea:#0A2830; --map-water:#113D47; --map-wet:#16332F; --map-green:#192C22; --map-sand:#2A2A20;
  --map-road:#30434A; --map-case:#0E181C; --map-minor:#24353B; --map-major:#7C6230; --map-major-case:#0E181C; --map-label:#A8BCC2; --map-halo:#152227;
  --c-red:#EE6250; --c-orange:#F09A3A; --c-amber:#D9AE3A; --c-blue:#5B9EE8; --c-sky:#7DB6E3; --c-green:#79B65C; --c-magenta:#D461A9; --c-purple:#A283E6; --c-teal:#3FB6A9; --c-wine:#E2526A; --c-grey:#93A3A9; --c-brown:#C98B4E;
  --warn-bg:#3A2C10; --warn-ink:#F2CF85; --ok-bg:#1C3318; --ok-ink:#A9D893; --bad-bg:#3E1A17; --bad-ink:#F4A79C;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1519; --surface:#132026; --surface-2:#1A2B32; --ink:#E1EBEE; --ink-2:#9DB0B6; --ink-3:#6E838A; --line:#293C44;
  --accent:#55B7C1; --accent-soft:#163A40; --on-accent:#05252A;
  --map-land:#152227; --map-sea:#0A2830; --map-water:#113D47; --map-wet:#16332F; --map-green:#192C22; --map-sand:#2A2A20;
  --map-road:#30434A; --map-case:#0E181C; --map-minor:#24353B; --map-major:#7C6230; --map-major-case:#0E181C; --map-label:#A8BCC2; --map-halo:#152227;
  --c-red:#EE6250; --c-orange:#F09A3A; --c-amber:#D9AE3A; --c-blue:#5B9EE8; --c-sky:#7DB6E3; --c-green:#79B65C; --c-magenta:#D461A9; --c-purple:#A283E6; --c-teal:#3FB6A9; --c-wine:#E2526A; --c-grey:#93A3A9; --c-brown:#C98B4E;
  --warn-bg:#3A2C10; --warn-ink:#F2CF85; --ok-bg:#1C3318; --ok-ink:#A9D893; --bad-bg:#3E1A17; --bad-ink:#F4A79C;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column}
header.top{background:var(--surface);border-bottom:1px solid var(--line);flex:none}
header.top .in{display:flex;align-items:center;gap:10px;padding-block:9px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store-pill{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.store-pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.store-pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 96px}
nav.tabs{flex:none;background:var(--surface);border-top:1px solid var(--line)}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;margin:0 auto}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 8px;color:var(--ink-3);font-size:11.5px;font-weight:600;letter-spacing:.03em;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
h3{font-size:15px;font-weight:700;margin:0}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-size:.88em;font-variant-numeric:tabular-nums}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel>h2,.panel>.ph{margin-bottom:10px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;min-height:38px;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--c-wine);border-color:color-mix(in srgb,var(--c-wine) 45%,var(--line))}
.btn.danger.armed{background:var(--c-wine);color:#fff;border-color:var(--c-wine)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.hint{font-size:12.5px;color:var(--ink-3)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=datetime-local],select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:15px;min-height:40px}
textarea{resize:vertical;min-height:80px;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 9px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:30px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 11px 6px 9px;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--surface)}
.tchips input{position:absolute;opacity:0;pointer-events:none}
.tchips label i{width:10px;height:10px;border-radius:50%}
.tchips label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tchips label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.note{border-radius:10px;padding:10px 12px;font-size:13.5px;background:var(--warn-bg);color:var(--warn-ink)}
.note.info{background:var(--accent-soft);color:var(--ink)}
.empty{text-align:left;padding:22px 18px;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.empty h2{margin-bottom:6px}
.empty .row{margin-top:14px}
/* Map */
.view-map{overflow:hidden}
.map-wrap{position:absolute;inset:0;background:var(--map-land)}
.map-wrap canvas{display:block;touch-action:none;cursor:grab}
.map-top{position:absolute;top:8px;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
.map-top>*{pointer-events:auto;box-shadow:var(--shadow)}
.map-top select{width:auto;min-height:36px;padding:5px 30px 5px 10px;font-size:13px;font-weight:600}
.map-side{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.map-side button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:20px;font-weight:600;cursor:pointer;display:grid;place-items:center}
.map-side button svg{width:19px;height:19px}
.map-bottom{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.map-bottom>*{pointer-events:auto}
.map-bar{display:flex;gap:8px;align-items:flex-end;justify-content:space-between}
.map-info{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;box-shadow:var(--shadow);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.map-info b{font-family:var(--f-display);font-size:17px}
.fab{background:var(--accent);color:var(--on-accent);border:0;border-radius:99px;padding:12px 18px 12px 14px;font-weight:700;font-size:15px;box-shadow:var(--shadow);display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.fab svg{width:20px;height:20px}
.replay{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.replay input{flex:1;accent-color:var(--accent);min-width:0}
.replay span{font-size:12.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.legend{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;font-size:12.5px;max-height:34vh;overflow:auto}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.map-hint{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;box-shadow:var(--shadow);pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.osm{position:absolute;right:max(4px,env(safe-area-inset-right,0px));bottom:2px;font-size:10px;color:var(--ink-3);pointer-events:none}
/* Log */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
@media (max-width:620px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
.day{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:16px 0 6px}
.inc{display:grid;grid-template-columns:4px 54px 1fr;gap:0 10px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 0;cursor:pointer;margin-bottom:6px;overflow:hidden}
.inc:hover{border-color:var(--ink-3)}
.inc .stripe{align-self:stretch;margin:-10px 0;border-radius:0}
.inc .t{font-family:var(--f-mono);font-size:13px;padding-top:1px;color:var(--ink-2)}
.inc .t small{display:block;font-size:10.5px;color:var(--ink-3)}
.inc .b{min-width:0;display:flex;flex-direction:column;gap:3px}
.inc .b b{font-size:15px}
.inc .b .loc{color:var(--ink-2);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inc .b .d{font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* Patterns */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .k{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--ink-3)}
.up{color:var(--c-wine)} .down{color:var(--c-green)}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:minmax(80px,140px) 1fr 34px;gap:8px;align-items:center;font-size:13.5px}
.bar .tr{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:flex}
.bar .tr span{height:100%}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.hm{border-collapse:separate;border-spacing:3px;font-size:12.5px;width:100%;min-width:480px}
table.hm th{font-weight:700;color:var(--ink-2);text-align:center;font-size:11.5px;letter-spacing:.03em;padding:2px}
table.hm th:first-child{text-align:left}
table.hm td{text-align:center;padding:7px 2px;border-radius:5px;font-variant-numeric:tabular-nums;font-weight:600}
table.hm td.a{text-align:left;font-weight:600;background:none;white-space:nowrap;padding-right:8px}
.alert{border-left:4px solid var(--c-red);background:var(--surface);border-radius:4px 10px 10px 4px;padding:10px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.alert .refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:2px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--f-body);font-size:11px;fill:var(--ink-3)}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2);margin-top:6px}
.lg span{display:inline-flex;align-items:center;gap:5px}.lg i{width:9px;height:9px;border-radius:2px}
/* SAPS */
.statusbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.statuslegend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px;font-size:13px}
.statuslegend b{font-variant-numeric:tabular-nums}
/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(6,18,22,.45);z-index:50;display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.sheet-bg{align-items:center}.sheet{height:calc(100% - 48px);border-radius:14px;overflow:hidden}}
.sheet-head{background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.sheet-head .in{display:flex;align-items:center;gap:10px;padding-block:10px}
.sheet-head h2{flex:1;min-width:0}
.sheet-body{flex:1;overflow-y:auto;padding-block:16px 40px}
.sheet-foot{flex:none;background:var(--surface);border-top:1px solid var(--line)}
.sheet-foot .in{display:flex;gap:8px;justify-content:flex-end;padding-block:10px;flex-wrap:wrap}
.minimap{position:relative;height:220px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--map-land)}
.minimap canvas{display:block;touch-action:none}
.minimap .mm-hint{position:absolute;left:8px;bottom:8px;background:var(--surface);border-radius:7px;padding:3px 8px;font-size:12px;font-weight:600;box-shadow:var(--shadow)}
dl.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;margin:0;font-size:14.5px}
dl.kv dt{color:var(--ink-2);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding-top:2px}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:460px){dl.kv{grid-template-columns:1fr}dl.kv dd{margin-bottom:6px}}
.hist{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.subtabs{margin-bottom:14px}
.card-rv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card-rv.off{opacity:.55}
.quote{font-size:13px;color:var(--ink-2);border-left:3px solid var(--line);padding-left:8px;font-style:italic}
.contact{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.contact .num{font-family:var(--f-mono);font-size:15px}
.setrow{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .grow{flex:1;min-width:0}
pre.out{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--f-mono);font-size:12.5px;max-height:50vh;overflow:auto;margin:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
nav.tabs .in{grid-template-columns:repeat(6,1fr)}
nav.tabs button{font-size:11px;padding:7px 0 8px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.card:hover{border-color:var(--ink-3)}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card h3{font-size:16px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px}
.grade{font-family:var(--f-mono);font-weight:600;font-size:12px;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink)}
.grade.g-hi{background:var(--ok-bg);color:var(--ok-ink)}
.grade.g-mid{background:var(--warn-bg);color:var(--warn-ink)}
.grade.g-lo{background:var(--bad-bg);color:var(--bad-ink)}
.rep{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.rep.dismissed{opacity:.6}
.rep .txt{font-size:14px;overflow-wrap:anywhere}
.rep .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--c-wine);display:inline-block}
@media (prefers-reduced-motion:no-preference){.live-dot{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}}
.mapbig{height:320px}
.modebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.modebar .btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl input,.tbl select{min-height:34px;padding:5px 7px;font-size:13.5px}
.tbl input[type=time]{width:118px}
.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.task{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task.done span{text-decoration:line-through;color:var(--ink-3)}
.task input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.inline-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.welcome ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.layers{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:6px 16px}
.swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
.sect{display:flex;flex-direction:column;gap:8px}
.sect>.ph{margin-bottom:2px}

.bar{grid-template-columns:minmax(90px,160px) 1fr auto}
.bar .n{min-width:34px}

  const st=statusOf?statusOf(cam):null;const col=st?C.tok(CV[st].tok):C.ink3;const r=Math.max(16,Math.min(70,(cam.range||40)/MPD*mv.s));const dir=((cam.dir??0)-90)*Math.PI/180,half=(cam.fov||90)/2*Math.PI/180;

  ctx.beginPath();ctx.rect(x-4,y-4,8,8);ctx.fillStyle=col;ctx.fill();ctx.strokeStyle=C.surface;ctx.lineWidth=1.5;ctx.stroke();if(act)hits.push({x,y,r:7,act:()=>act(cam)})}ctx.restore();return hits}

const RX=[
 ['phone',/(?<!\d)(?:\+?27|0)(?:[\s-]?\d){9}(?!\d)/g,'[phone removed]'],['email',/[\w.+-]+@[\w-]+\.[\w.-]+/g,'[email removed]'],['ID number',/(?<!\d)\d{13}(?!\d)/g,'[ID removed]'],
 ['registration',/\b[A-Z]{2}\s?\d{2}\s?[A-Z]{2}\s?(?:EC|GP|ZN|MP|NW|FS|NC|WC|L)\b/gi,'[plate removed]'],['registration',/\b[A-Z]{3}\s?\d{3}\s?(?:EC|GP|ZN|KZN|MP|NW|FS|NC|WC)\b/gi,'[plate removed]'],
 ['registration',/\b[A-Z]{3}\s?\d{3}\s?(?:L|N)\b/g,'[plate removed]'],['registration',/\b[A-Z]{2,3}\s?\d{3}[\s-]\d{1,3}\b/g,'[plate removed]'],['registration',/\bC[A-Z]{1,2}\s?\d{4,6}\b/g,'[plate removed]']];
function piiScan(t){const found=new Set();for(const[k,r] of RX){r.lastIndex=0;if(r.test(String(t||'')))found.add(k)}return[...found]}
function redact(t,counter){let s=String(t||'');for(const[k,r,rep] of RX){s=s.replace(r,()=>{if(counter)counter[k]=(counter[k]||0)+1;return rep})}return s}

function footageRequest(c){const w=caseWindow(c);const cov=coverage(c);const warn=windowWarnings(c);let start=w?.start,end=w?.end;if(warn.length){start=Math.min(start||Infinity,...warn.map(s=>s.ts-15*MIN));end=Math.max(end||0,...warn.map(s=>s.ts+15*MIN))}

 `## Camera canvass`,...near.map(cam=>`- ${cam.name} (${cam.type}, ${cam.street||''}): ${CV[canvassOf(c,cam.id)].label}`),cov.gaps.length?`\nStreets with no camera checked: ${cov.gaps.slice(0,12).map(s=>s.name).join(', ')}`:'',``,

 return L.filter((x,k,a)=>!(x===''&&a[k-1]==='')).join('\n')}

/* Import */
function parseWhatsApp(text){const lines=String(text).replace(/\r/g,'').split('\n');const msgs=[];
 const reI=/^[‎‏]?\[(\d{1,4})[\/.-](\d{1,2})[\/.-](\d{1,4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp]\.?\s?[Mm]\.?)?\]\s*([^:]{1,60}?):\s?(.*)$/;
 const reA=/^[‎‏]?(\d{1,4})[\/.-](\d{1,2})[\/.-](\d{1,4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp]\.?\s?[Mm]\.?)?\s+[-–]\s+([^:]{1,60}?):\s?(.*)$/;
 const reSys=/^[‎‏]?\[?\d{1,4}[\/.-]\d{1,2}[\/.-]\d{1,4},?\s+\d{1,2}:\d{2}/;
 for(const l of lines){const m=reI.exec(l)||reA.exec(l);if(!m&&reSys.test(l))continue;if(m){let[_,a,b,c,h,mi,ap,snd,tx]=m;a=+a;b=+b;c=+c;h=+h;let Y,M,D;if(a>31){Y=a;M=b;D=c}else{D=a;M=b;Y=c;if(M>12){[D,M]=[M,D]}}if(Y<100)Y+=2000;
   if(ap){const p=ap.toLowerCase().startsWith('p');if(p&&h<12)h+=12;if(!p&&h===12)h=0}msgs.push({ts:new Date(Y,M-1,D,h,+mi).getTime(),sender:snd.trim().replace(/^[‎~\s]+/,''),text:tx})}
  else if(l.trim()){if(msgs.length)msgs[msgs.length-1].text+='\n'+l;else msgs.push({ts:null,sender:null,text:l})}}return msgs}
const SKIP=/^(?:[‎]?(?:<Media omitted>|image omitted|video omitted|audio omitted|sticker omitted|GIF omitted|document omitted|This message was deleted|You deleted this message|Missed voice call|null))$/i;
function isOrgSender(n){const s=n.toLowerCase();return/(control|reaction|response|security|saps|ops\b|armed|patrol|unit)/.test(s)||sourceList().some(x=>x.type==='Control room'&&s.includes(x.name.toLowerCase().split(' ')[0]))}
function prepImport(raw,since){const msgs=parseWhatsApp(raw);const members=new Map();const red={};
 const keep=msgs.filter(m=>!since||m.ts==null||m.ts>=since).filter(m=>!SKIP.test(m.text.trim()));
 const out=keep.map(m=>{let who='';if(m.sender){if(isOrgSender(m.sender)&&!/\d{6,}/.test(m.sender))who=m.sender;else{if(!members.has(m.sender))members.set(m.sender,'Member '+(members.size+1));who=members.get(m.sender)}}
  let t=redact(m.text,red).replace(/@[~⁨]?[\p{L}][\p{L}'’-]*(?:\s[\p{L}][\p{L}'’-]*)?/gu,()=>{red.mention=(red.mention||0)+1;return '@member'});
  const d=m.ts?toLocalInput(m.ts).replace('T',' '):'';return (d?`[${d}] `:'')+(who?who+': ':'')+t});
 const chunks=[];let cur='';for(const l of out){if(cur.length+l.length>9000&&cur){chunks.push(cur);cur=''}cur+=l+'\n'}if(cur.trim())chunks.push(cur);
 return{n:keep.length,total:msgs.length,members:members.size,red,text:out.join('\n'),chunks}}
function aiPrompt(chunk){const areas=areaList().map(a=>a.name);const now=new Date();
 return `You help a community safety coordinator in Jeffreys Bay, Eastern Cape, South Africa turn WhatsApp and control-room messages into structured records. Messages are already redacted: private senders appear as "Member N"; security units keep their call signs.

Today is ${now.toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}. Times are South African local time.

Split the messages into separate items. Merge messages about the same event. Ignore greetings, thanks, chatter, adverts, hoaxes, lost pets and load-shedding notices.

Return ONLY a JSON array, no prose. Each item:
{"kind": "incident" (a crime, emergency, collision or suspicious activity that happened) or "report" (anything else worth keeping: a footage request, a camera result, a patrol update, an acknowledgement),
 "type": one of ${JSON.stringify(TYPES.map(t=>t.id))} where ${TYPES.map(t=>t.id+' = '+t.label).join('; ')},
 "when": "YYYY-MM-DDTHH:MM" when it happened, or null; "until": "YYYY-MM-DDTHH:MM" if a time window is given, else null,
 "approx": true if the time is an estimate,
 "area": one of ${JSON.stringify(areas)} or "Unknown",
 "street": street name or landmark only (never a house number), or "",
 "method": one of ${JSON.stringify(METHODS)} or "",
 "items": short list of items taken, or "",
 "description": one or two neutral sentences,
 "vehicle": make, model and colour, or "",
 "quote": the most relevant message text, at most 20 words, personal details removed,
 "confidence": "high", "medium" or "low"}

Privacy rules (POPIA): never include personal names, phone numbers, ID numbers, registration numbers or house numbers. Describe people only by behaviour, clothing and build. Never mention nationality, ethnicity, race, religion or language, or anyone's medical condition. If nothing qualifies, return [].

Messages:
${chunk}`}
function renderImport(){const body=$('#more-body');const I=S.imp||(S.imp={raw:'',since:toDateInput(Date.now()-30*DAY),source:'',prep:null,drafts:null,busy:false,progress:''});
 body.innerHTML=`<div class="stack"><div class="panel stack"><p class="muted">Paste messages from a WhatsApp group or a control room, or open a WhatsApp chat export (.txt or .zip). Private names, phone, ID and registration numbers are stripped on this device before anything is sent for extraction.</p>
 <div class="field"><label for="im-text">Messages</label><textarea id="im-text" style="min-height:150px" placeholder="Paste messages here">${esc(I.raw)}</textarea></div>
 <div class="grid2"><div class="field"><label for="im-file">Or open a chat export</label><input type="file" id="im-file" accept=".txt,.zip,text/plain,application/zip"></div><div class="field"><label for="im-since">Only messages since</label><input type="date" id="im-since" value="${esc(I.since)}"></div></div>
 <div class="field"><label for="im-source">Source of these messages</label><select id="im-source"><option value="">Choose source</option>${opts(sourceNames(),I.source)}</select></div>
 <div class="row"><button class="btn" id="im-clean">Clean and preview</button><button class="btn primary" id="im-run" ${S.sample?'':'disabled'}>Extract</button></div>
 ${S.sample?'':'<p class="note">Automatic extraction needs this page open in Claude. You can still clean the text here.</p>'}<p class="hint">Extraction runs on the Claude account of whoever uses the page.</p></div><div id="im-prep"></div><div id="im-review"></div></div>`;
 const ta=$('#im-text');ta.addEventListener('input',()=>{I.raw=ta.value;I.prep=null});$('#im-since').onchange=e=>{I.since=e.target.value;I.prep=null};$('#im-source').onchange=e=>I.source=e.target.value;
 $('#im-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let txt;if(/\.zip$/i.test(f.name)||f.type.includes('zip')){if(!window.JSZip)throw new Error('Zip support did not load');const z=await JSZip.loadAsync(f);const entry=Object.values(z.files).find(x=>/\.txt$/i.test(x.name));if(!entry)throw new Error('No .txt chat file in that zip');txt=await entry.async('string')}else txt=await f.text();I.raw=txt;ta.value=txt.length>200000?txt.slice(0,200000):txt;I.prep=null;toast(`Loaded ${f.name}`)}catch(err){toast('Could not read that file: '+err.message,4000)}};
 const doPrep=()=>{I.prep=prepImport(I.raw,fromLocalInput(I.since));drawPrep()};
 $('#im-clean').onclick=()=>{if(!I.raw.trim()){toast('Paste messages first');return}doPrep()};
 $('#im-run').onclick=async()=>{if(!I.raw.trim()){toast('Paste messages first');return}if(!I.prep)doPrep();if(!I.prep.chunks.length){toast('No messages in that date range');return}if(I.prep.chunks.length>8){toast('Too many messages. Narrow the date range.',4500);return}runExtract()};
 drawPrep();drawReview()}
function drawPrep(){const el=$('#im-prep');const I=S.imp;if(!el)return;if(!I.prep){el.innerHTML='';return}const p=I.prep,r=p.red;
 const parts=[['phone','phone numbers'],['email','email addresses'],['ID number','ID numbers'],['registration','registration numbers'],['mention','@mentions']].filter(([k])=>r[k]).map(([k,l])=>`${r[k]} ${l}`);
 el.innerHTML=`<div class="panel stack"><div class="ph"><h2>Cleaned text</h2><span class="hint">${p.n} of ${p.total} messages · ${p.chunks.length} ${p.chunks.length===1?'part':'parts'}</span></div><p class="small">${p.members?`${p.members} private senders replaced with "Member" numbers. `:''}${parts.length?'Removed '+parts.join(', ')+'.':'No phone, ID or registration numbers found.'} Names inside messages can't be detected reliably, so check before saving.</p><details><summary class="small" style="cursor:pointer;font-weight:600">Show cleaned text</summary><pre class="out" style="margin-top:8px">${esc(p.text.slice(0,20000))}</pre></details></div>`}
async function runExtract(){const I=S.imp;if(I.busy)return;I.busy=true;I.drafts=[];const n=I.prep.chunks.length;const known=new Set(TYPES.map(t=>t.id)),areas=new Set(areaList().map(a=>a.name));let failed=0;const src=srcByName(I.source);
 for(let k=0;k<n;k++){I.progress=`Reading part ${k+1} of ${n}…`;drawReview();
  try{const res=await S.sample.json(aiPrompt(I.prep.chunks[k]),{modelTier:'default'});const arr=Array.isArray(res)?res:(res&&Array.isArray(res.items)?res.items:[]);
   for(const x of arr){if(!x||typeof x!=='object')continue;const d={key:uid('d'),include:true,kind:x.kind==='report'?'report':'incident',type:known.has(x.type)?x.type:'other',ts:fromLocalInput(x.when)||null,tsEnd:fromLocalInput(x.until)||null,approx:!!x.approx||!x.when,area:areas.has(x.area)?x.area:'',street:redact(String(x.street||'')).replace(/^\d+[a-z]?\s+/i,''),method:METHODS.includes(x.method)?x.method:'',items:redact(x.items||''),desc:redact(x.description||''),vehicle:redact(x.vehicle||''),quote:redact(x.quote||''),conf:x.confidence||'medium',source:I.source,rel:src?.rel||'C',cred:x.confidence==='high'?2:x.confidence==='low'?4:3};
    const g=d.street?geocodeStreet(d.street):null;if(g){d.lon=g.lon;d.lat=g.lat;if(!d.area)d.area=nearestArea(g.lon,g.lat)||''}else if(d.area){const c=areaCentre(d.area);if(c){d.lon=c.lon;d.lat=c.lat;d.areaPin=true}}
    if(!d.ts)d.ts=Date.now();d.dup=d.kind==='incident'&&S.incidents.find(o=>o.type===d.type&&Math.abs(o.ts-d.ts)<=3*3600e3&&(!d.area||o.area===d.area));if(d.dup)d.include=false;I.drafts.push(d)}}
  catch(e){failed++;const c=e&&e.code;if(c==='not_granted'){toast('Extraction was not allowed for this page.',4500);break}if(c==='rate_limited'){toast('Usage limit reached for now.',4500);break}}}

function drawReview(){const el=$('#im-review');const I=S.imp;if(!el)return;

 ${I.drafts.map(d=>`<div class="card-rv ${d.include?'':'off'}" data-k="${d.key}"><label class="chk"><input type="checkbox" data-f="include" ${d.include?'checked':''}><b>Save</b><select data-f="kind" style="width:auto;margin-left:6px"><option value="incident" ${d.kind==='incident'?'selected':''}>as incident + report</option><option value="report" ${d.kind==='report'?'selected':''}>as report only</option></select><span class="grade" style="margin-left:auto">${esc(d.rel)}${d.cred}</span></label>

  <div class="grid2"><div class="field"><label>Type</label><select data-f="type">${opts(TYPES,d.type,t=>t.id,t=>t.label)}</select></div><div class="field"><label>When</label><input type="datetime-local" data-f="ts" value="${toLocalInput(d.ts)}"></div></div>

  <div class="field"><label>Description</label><textarea data-f="desc" style="min-height:64px">${esc(d.desc)}</textarea></div></div>`).join('')}${streetDatalist('st-imp')}

 el.querySelectorAll('.card-rv').forEach(card=>{const d=I.drafts.find(x=>x.key===card.dataset.k);card.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;if(f==='include'){d.include=e.target.checked;drawReview();return}if(f==='ts'){d.ts=fromLocalInput(e.target.value)||d.ts;d.approx=false;return}
  d[f]=e.target.value;if(f==='street'){const g=geocodeStreet(d.street);if(g){d.lon=g.lon;d.lat=g.lat;d.areaPin=false}}if(f==='area'&&(d.lon==null||d.areaPin)){const c=areaCentre(d.area);if(c){d.lon=c.lon;d.lat=c.lat;d.areaPin=true}}})});

 ...Object.entries(d.incidents.byArea).slice(0,3).map(([a,n])=>`- ${a}: ${n}`),`- Busiest band: ${Object.keys(d.incidents.byTimeBand)[0]||'none'}`,...d.nearRepeats.map(n=>`- Near-repeat: ${n.count} in ${n.area} (${n.streets.join(', ')})`),``,`CASES`,...d.openCases.map(c=>`- ${c.ref} ${c.title}: ${c.incidents} incidents, cameras checked ${c.camerasChecked}${c.openTasks.length?`, next: ${c.openTasks[0]}`:''}`),``,
 `OPERATIONS`,...(d.operations.length?d.operations.map(o=>`- ${o.title} (${o.status})${o.firstOnSceneMinutes!=null?`, first on scene ${o.firstOnSceneMinutes} min`:''}`):['- None']),``,`PATROL PLAN`,...d.patrolZones.map(z=>`- ${z.zone} ${z.area}: ${z.bestWindow}${z.days?`, ${z.days}`:''}`),``,`ASKS FOR SAPS`,`- ${d.incidents.crimesNotReportedToSaps} crimes not yet reported this week`,...d.openCases.filter(c=>c.status==='With SAPS').map(c=>`- Feedback on ${c.ref}`)];return L.join('\n')}
const TIPS={'Forced window':'Check window latches before bed and keep burglar bars closed at night.','Sliding door lifted':'Fit anti-lift blocks to sliding doors. They cost little and stop the most common sliding-door entry.','Burglar bars bent or cut':'Check burglar bars for loose or bent joints and have weak ones welded.','Unlocked or open access':'Lock doors and gates even when you are at home, especially at night.','Forced door':'A security gate or a deadbolt on outside doors makes forced entry much slower and louder.','Wall, fence or gate climbed':'Keep bins, ladders and anything climbable away from walls and fences.',tfv:'Leave nothing visible in parked cars, and check the car actually locked before walking away.',default:'Keep outside lights on at night and report suspicious activity to the watch straight away.'};
function bulletin(d){const top=Object.entries(d.incidents.byArea).slice(0,2).map(([a])=>a);const band0=Object.keys(d.incidents.byTimeBand)[0];const brk=Object.entries(d.incidents.byType).filter(([k])=>/burglary|break-in/i.test(k)).reduce((a,[,v])=>a+v,0);
 const meth=Object.keys(d.incidents.breakInMethods)[0];const tfv=d.incidents.byType['Theft from vehicle']||0;const tip=meth&&TIPS[meth]?TIPS[meth]:tfv>=2?TIPS.tfv:TIPS.default;const nr=d.nearRepeats[0];
 const from=new Date(fromLocalInput(d.period.from)),to=new Date(fromLocalInput(d.period.to));const fm=x=>x.toLocaleDateString('en-ZA',{day:'numeric',month:'short'});
 return [`WaveWatch weekly update · ${fm(from)} to ${fm(to)}`,``,`This week ${d.incidents.total} incidents were logged in Jeffreys Bay (${d.incidents.previousPeriod} the week before), including ${brk} break-ins or attempts.`,
  top.length?`Most activity was in ${top.join(' and ')}${band0?`, mostly between ${band0.split('–')[0]}:00 and ${band0.split('–')[1]}:00`:''}.`:'',nr?`Several break-ins happened close together in ${nr.area}. If you live there, please take extra care for the next two weeks and keep outside lights on.`:'',
  d.cameraChecksThisPeriod?`Thank you to everyone who checked their cameras: ${d.cameraChecksThisPeriod} checks were done for open cases this week.`:'',d.patrolsLogged?`The watch carried out ${d.patrolsLogged} patrols this week.`:'',``,`Tip of the week: ${tip}`,``,`Emergencies: SAPS 10111, or 112 from any mobile. Report suspicious activity to the watch with the time, place and a description. Please don't post names or photos of people in the group.`].filter((x,k,a)=>x!==''||a[k-1]!=='').join('\n').replace(/\n{3,}/g,'\n\n')}
async function aiText(prompt,out,btn){if(!S.sample){toast('AI writing needs this page open in Claude');return null}btn&&(btn.disabled=true);out.textContent='Writing…';
 try{const r=await S.sample(prompt,{modelTier:'default',cache:false,onText:({text})=>{out.textContent=text}});out.textContent=r.text;return r.text}catch(e){out.textContent='';toast(e&&e.code==='rate_limited'?'Usage limit reached. Try again later.':e&&e.code==='not_granted'?'AI is not allowed for this page.':'Could not write it. Try again.',4000);return null}finally{btn&&(btn.disabled=false)}}
function renderBriefs(root){const days=S.briefDays||7;const d=digest(days);const fb=briefFallback(d),bl=bulletin(d);
 root.innerHTML=`<div class="stack"><div class="seg" id="bd" style="align-self:flex-start">${[[7,'Last 7 days'],[14,'Last 14 days'],[30,'Last 30 days']].map(([v,l])=>`<button data-v="${v}" aria-pressed="${days===v}">${l}</button>`).join('')}</div>
 <div class="panel sect"><div class="ph"><h2>Intelligence brief</h2><span class="hint">For the coordinator, committee and station</span></div><p class="small muted">Covers patterns, near-repeats, open cases with their gaps and likely exits, operations, a patrol plan and asks for SAPS. AI writes it from the figures below; the draft beside it uses no AI.</p>
  <div class="row"><button class="btn primary" id="br-ai" ${S.sample?'':'disabled'}>Write brief with AI</button><button class="btn" id="br-copy">Copy</button><button class="btn" id="br-save">Save .md</button></div><pre class="out" id="br-out">${esc(fb)}</pre></div>

  <div class="row"><button class="btn" id="bl-ai" ${S.sample?'':'disabled'}>Polish with AI</button><button class="btn primary" id="bl-copy">Copy for WhatsApp</button></div><pre class="out" id="bl-out">${esc(bl)}</pre><div id="bl-warn"></div></div>

 $('#bd').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.briefDays=+b.dataset.v;renderInsights()};
 const bo=$('#br-out'),lo=$('#bl-out');
 $('#br-ai').onclick=()=>aiText(`You are the analyst for WaveWatch, a community safety desk in Jeffreys Bay, South Africa. Write the ${days}-day intelligence brief for the coordinator, using ONLY the JSON data below. Plain text, short headed sections in capitals: HEADLINE (two sentences), PATTERNS, CASES, OPERATIONS, PATROL PLAN (zones with time windows), ASKS FOR SAPS, WATCH NEXT. Use numbers and refs from the data. At most 380 words. Never invent facts. No personal names, house numbers or registration numbers. Describe people only by behaviour and clothing.\n\nDATA:\n${JSON.stringify(d)}`,bo,$('#br-ai'));
 $('#br-copy').onclick=()=>copyText(bo.textContent);$('#br-save').onclick=()=>saveFile(`WaveWatch-brief-${d.period.to}.md`,bo.textContent);
 const warn=()=>{const p=piiScan(lo.textContent);const st=STREET_NAMES.filter(n=>n.length>5&&lo.textContent.includes(n));$('#bl-warn').innerHTML=p.length||st.length?`<p class="note">Check before sending: contains ${esc([...p,...st.slice(0,3)].join(', '))}.</p>`:''};warn();
 $('#bl-ai').onclick=async()=>{const t=await aiText(`Rewrite this community safety update for a Jeffreys Bay residents' WhatsApp group so it reads warmly and clearly. Keep every number exactly as given. Keep it under 170 words, plain text, no emoji overload (at most two). Strict rules: mention only suburb names and time bands, never street names, house numbers, case refs, descriptions of people, vehicles, nationality or anything that could identify a household or person.\n\nUPDATE:\n${bl}`,lo,$('#bl-ai'));if(t)warn()};
 $('#bl-copy').onclick=()=>copyText(lo.textContent)}

/* ================= Ask WaveWatch ================= */
S.askLog=[];
function askData(){const inc=[...S.incidents].sort((a,b)=>b.ts-a.ts).slice(0,600);
 const rows=inc.map(i=>[i.ref,T[i.type]?.label,toLocalInput(i.ts).replace('T',' '),i.tsEnd?fmtTime(i.tsEnd):'',i.area||'',i.street||'',i.method||'',SP[i.saps||'none'].label,i.cas?'CAS':'',byId('cases',i.caseId)?.ref||'',byId('ops',i.opId)?.ref||'',i.source||''].join('|'));
 const cases=S.cases.map(c=>{const st=caseStats(c);return `${c.ref}|${c.title}|${CS[c.status||'open'].label}|${c.area}|series:${c.series||''}|incidents:${st.inc.length}|sightings:${(c.sightings||[]).length}|cams checked:${st.checked}/${st.near.length}|open tasks:${st.open}|gaps:${coverage(c).gaps.slice(0,5).map(s=>s.name).join(', ')}`});
 const ops=S.ops.map(o=>`${o.ref}|${OK[o.kind]?.label}|${o.title}|${OS[o.status].label}|start ${toLocalInput(o.start).replace('T',' ')}|${o.end?'duration '+mins(o.start,o.end)+' min':'active'}|responders: ${(o.responders||[]).map(r=>`${r.role} ${r.called&&r.arrived?mins(r.called,r.arrived)+'min':'n/a'}`).join('; ')}`);
 const pat=S.patrols.map(p=>`${toLocalInput(p.start).replace('T',' ')}|${p.area}|${p.end?mins(p.start,p.end)+' min':''}`);
 return `INCIDENTS (ref|type|start|until|area|street|method|SAPS status|CAS|case|operation|source), newest first, ${inc.length} of ${S.incidents.length}:\n${rows.join('\n')}\n\nCASES:\n${cases.join('\n')||'none'}\n\nOPERATIONS:\n${ops.join('\n')||'none'}\n\nPATROLS:\n${pat.join('\n')||'none'}\n\nREPORTS FEED: ${S.reports.length} reports, ${S.reports.filter(r=>r.state==='new').length} new.\nCAMERAS REGISTERED: ${S.cameras.length}.`}
function renderAsk(root){const sugg=['Which area had the most break-ins in the last 30 days, and at what time?','Which open case has the most camera gaps?','What is the slowest responder type on average?','How many crimes this month are not reported to SAPS?','Where should the watch patrol this weekend?'];
 root.innerHTML=`<div class="stack"><div class="panel stack"><h2>Ask WaveWatch</h2><p class="small muted">Ask in plain language. Claude answers from the records stored here only, and cites refs.</p>
 <div class="field"><label for="ask-q">Question</label><textarea id="ask-q" style="min-height:70px" placeholder="e.g. How many vehicle break-ins in Pellsrus since September?"></textarea></div><div class="row"><button class="btn primary" id="ask-go" ${S.sample?'':'disabled'}>Ask</button>${S.sample?'':'<span class="hint">Needs this page open in Claude.</span>'}</div>
 <div class="tchips">${sugg.map((s,k)=>`<button class="chip" data-sq="${k}" style="cursor:pointer;border:0;font-size:12.5px;padding:6px 10px;white-space:normal;text-align:left">${esc(s)}</button>`).join('')}</div></div>
 <div id="ask-log" class="stack">${S.askLog.slice().reverse().map(a=>`<div class="panel"><p class="small"><b>${esc(a.q)}</b></p><pre class="out" style="margin-top:8px">${esc(a.a)}</pre></div>`).join('')}</div></div>`;
 root.querySelectorAll('[data-sq]').forEach(b=>b.onclick=()=>{$('#ask-q').value=sugg[+b.dataset.sq];$('#ask-q').focus()});
 $('#ask-go').onclick=async()=>{const q=$('#ask-q').value.trim();if(!q)return;const box=document.createElement('div');box.className='panel';box.innerHTML=`<p class="small"><b></b></p><pre class="out" style="margin-top:8px"></pre>`;$('b',box).textContent=q;$('#ask-log').prepend(box);const out=$('pre',box);
  const a=await aiText(`You answer questions for the coordinator of WaveWatch, a community safety desk in Jeffreys Bay, South Africa. Today is ${new Date().toLocaleString('en-ZA',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}. Answer ONLY from the data below. Count carefully. Be concise (at most 150 words), lead with the answer and its number, cite refs where useful, and say plainly if the data cannot answer. Time bands are 00-04, 04-08 and so on. Records marked with a DEMO ref are sample data.\n\nQUESTION: ${q}\n\n${askData()}`,out,$('#ask-go'));
  if(a){S.askLog.push({q,a});$('#ask-q').value=''}}}

/* ================= SAPS station statistics ================= */
const SAPSCAT=[['Burglary at residential premises',['res_burg','attempt']],['Burglary at non-residential premises',['bus_burg']],['Theft out of or from motor vehicle',['tfv']],['Theft of motor vehicle and motorcycle',['vtheft']],['Robbery (all types)',['robbery']],['Assault (all types)',['assault']],['Malicious damage to property',['vandal']],['Drug-related crime',['drugs']],['All other theft',['theft','cable']]];
function quarters(n=8){const d=new Date();let y=d.getFullYear(),m=Math.floor(d.getMonth()/3)*3;const out=[];for(let k=0;k<n;k++){const q=m===3?1:m===6?2:m===9?3:4;const fy=m>=3?`${y}/${String(y+1).slice(2)}`:`${y-1}/${String(y).slice(2)}`;const s=new Date(y,m,1).getTime(),e=new Date(y,m+3,1).getTime();
 out.push({id:`q-${y}-${m}`,label:`Q${q} ${fy}`,range:`${new Date(s).toLocaleDateString('en-ZA',{month:'short'})} to ${new Date(e-1).toLocaleDateString('en-ZA',{month:'short',year:'numeric'})}`,s,e,partial:e>Date.now()});m-=3;if(m<0){m=9;y--}}return out}
function renderStats(root){const qs=quarters();const sel=S.statQ||qs[1].id;const q=qs.find(x=>x.id===sel)||qs[1];const doc=byId('stats',q.id)||{counts:{}};
 const ww=SAPSCAT.map(([,types])=>S.incidents.filter(i=>i.ts>=q.s&&i.ts<q.e&&types.includes(i.type)).length);
 const rows=SAPSCAT.map(([label],k)=>{const sv=doc.counts?.[k];return{label,k,saps:sv==null||sv===''?null:+sv,ww:ww[k]}});const mx=Math.max(1,...rows.map(r=>Math.max(r.saps||0,r.ww)));
 const tot=rows.filter(r=>r.saps!=null).reduce((a,r)=>[a[0]+r.saps,a[1]+r.ww],[0,0]);
 const hist=qs.filter(x=>byId('stats',x.id)).map(x=>{const d=byId('stats',x.id);const s=Object.values(d.counts||{}).reduce((a,v)=>a+(+v||0),0);const w=S.incidents.filter(i=>i.ts>=x.s&&i.ts<x.e&&SAPSCAT.some(([,t])=>t.includes(i.type))).length;return{x,s,w}});
 root.innerHTML=`<div class="stack"><p class="muted">Enter the station's quarterly figures (SAPS financial-year quarters, April to March) and compare them with what WaveWatch logged. The capture rate shows how much of recorded crime reaches the watch, and where residents may not be reporting to SAPS.</p>
 <div class="row"><select id="sq" style="width:auto">${qs.map(x=>`<option value="${x.id}" ${x.id===q.id?'selected':''}>${x.label} · ${x.range}${x.partial?' (in progress)':''}</option>`).join('')}</select>${doc.demo?'<span class="chip" style="background:var(--warn-bg);color:var(--warn-ink)">DEMO FIGURES</span>':''}</div>
 <div class="panel sect"><div class="ph"><h2>${esc(q.label)}</h2><span class="hint">${tot[0]?`WaveWatch captured ${pct(tot[1],tot[0])}% of SAPS-recorded crime in these categories`:'Enter SAPS figures to compare'}</span></div>
 <div class="scroll-x"><table class="tbl"><thead><tr><th>Category</th><th>SAPS</th><th>WaveWatch</th><th>Captured</th><th style="min-width:140px">Comparison</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.label)}</td><td><input type="number" min="0" data-k="${r.k}" value="${r.saps??''}" style="width:80px" aria-label="SAPS count for ${esc(r.label)}"></td><td class="num">${r.ww}</td><td class="num">${r.saps?pct(r.ww,r.saps)+'%':'—'}</td><td><div style="display:flex;flex-direction:column;gap:3px"><span style="height:7px;border-radius:3px;background:var(--c-blue);width:${(r.saps||0)/mx*100}%"></span><span style="height:7px;border-radius:3px;background:var(--accent);width:${r.ww/mx*100}%"></span></div></td></tr>`).join('')}</tbody></table></div>
 <div class="lg"><span><i ${sw('--c-blue')}></i>SAPS recorded</span><span><i ${sw('--accent')}></i>Logged in WaveWatch</span></div>
 <div class="grid2"><div class="field"><label for="sq-src">Source of the SAPS figures</label><input type="text" id="sq-src" value="${esc(doc.source||'')}" placeholder="e.g. station commander, CPF meeting"></div><div class="field" style="justify-content:flex-end"><button class="btn primary" id="sq-save">Save figures</button></div></div></div>
 ${hist.length?`<div class="panel"><h2>By quarter</h2><div class="scroll-x"><table class="tbl"><thead><tr><th>Quarter</th><th>SAPS total</th><th>WaveWatch</th><th>Captured</th></tr></thead><tbody>${hist.map(h=>`<tr><td>${esc(h.x.label)}</td><td class="num">${h.s}</td><td class="num">${h.w}</td><td class="num">${h.s?pct(h.w,h.s)+'%':'—'}</td></tr>`).join('')}</tbody></table></div></div>`:''}</div>`;
 $('#sq').onchange=e=>{S.statQ=e.target.value;renderInsights()};
